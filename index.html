<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1순위 실용 · 1.5</title>
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090D" media="(prefers-color-scheme: dark)">
<style>
@font-face {
  font-family: "Priority Sans";
  src: url("fonts/priority-sans.woff2") format("woff2");
  font-weight: 45 930;
  font-display: swap;
}
:root {
  --bg: #F3F4F8;
  --bg-2: #ECEEF4;
  --surface: #FFFFFF;
  --surface-2: #F1F2F6;
  --surface-3: #E7E9EF;
  --ink: #0C0E14;
  --ink-2: #363B47;
  --muted: #666D7C;
  --faint: #9AA0AD;
  --line: #E4E6EC;
  --brand: #5B57F2;
  --brand-2: #8A5CF6;
  --brand-soft: #ECEBFF;
  --accent: #E5484D;
  --accent-soft: #FDECEC;
  --ok: #17915A;
  --ok-soft: #E3F5EC;
  --warn: #A96A0C;
  --warn-soft: #FBF1DD;
  --chart: #B8BDC9;
  --grid: #E8EAF0;
  --scrim: rgba(12, 14, 20, .38);
  --glass: rgba(255, 255, 255, .72);
  --glass-line: rgba(255, 255, 255, .6);
  --shadow: 0 1px 2px rgba(16, 20, 32, .04), 0 6px 20px rgba(16, 20, 32, .06);
  --shadow-lg: 0 2px 6px rgba(16, 20, 32, .06), 0 18px 44px rgba(40, 36, 120, .16);
  --r-xl: 28px;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --font: "Priority Sans", "Pretendard", "Pretendard Variable", -apple-system, "SUIT", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #09090D; --bg-2: #0E0F14; --surface: #15161C; --surface-2: #1D1F27; --surface-3: #262833;
    --ink: #F4F5F8; --ink-2: #CDD1DA; --muted: #959BA8; --faint: #6A707D; --line: #252731;
    --brand: #8F8CFF; --brand-2: #B08CFF; --brand-soft: #22213F;
    --accent: #FF6B6E; --accent-soft: #3A1C20; --ok: #4FD18B; --ok-soft: #14291F; --warn: #F0B34A; --warn-soft: #33270F;
    --chart: #4A4F5E; --grid: #22242D; --scrim: rgba(0, 0, 0, .6);
    --glass: rgba(24, 25, 32, .72); --glass-line: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 20px 48px rgba(0, 0, 0, .5);
  }
  :root:not([data-theme="light"]) .vc { --vcol: var(--vcd, var(--vc)); }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #09090D; --bg-2: #0E0F14; --surface: #15161C; --surface-2: #1D1F27; --surface-3: #262833;
  --ink: #F4F5F8; --ink-2: #CDD1DA; --muted: #959BA8; --faint: #6A707D; --line: #252731;
  --brand: #8F8CFF; --brand-2: #B08CFF; --brand-soft: #22213F;
  --accent: #FF6B6E; --accent-soft: #3A1C20; --ok: #4FD18B; --ok-soft: #14291F; --warn: #F0B34A; --warn-soft: #33270F;
  --chart: #4A4F5E; --grid: #22242D; --scrim: rgba(0, 0, 0, .6);
  --glass: rgba(24, 25, 32, .72); --glass-line: rgba(255, 255, 255, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .4), 0 20px 48px rgba(0, 0, 0, .5);
}
:root[data-theme="dark"] .vc { --vcol: var(--vcd, var(--vc)); }
.vc { --vcol: var(--vc); }

/* ---------- base ---------- */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
  font-feature-settings: "tnum" 0;
}
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h2 { text-wrap: balance; }

#app {
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}

/* ---------- header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 5;
  margin-inline: -16px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  background: linear-gradient(var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent));
}
.brand { display: grid; gap: 2px; min-width: 0; }
.brand span { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span .hol { color: var(--accent); }
.brand b { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  display: grid; place-items: center; padding: 0; box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.iconbtn:active { transform: scale(.94); }
.iconbtn svg, nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.sm { width: 38px; height: 38px; box-shadow: none; }
.iconbtn.sm svg { width: 18px; height: 18px; }

/* ---------- floating tab bar ---------- */
nav.tabs {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  max-width: 496px; margin: 0 auto;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--glass-line);
  border-radius: 26px;
  box-shadow: var(--shadow-lg);
}
nav.tabs .in { display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px; gap: 2px; }
nav.tabs button {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 0 6px; background: none; border: 0; border-radius: 18px; color: var(--faint);
  font-size: 11px; font-weight: 700; letter-spacing: -0.01em;
  transition: background .2s ease, color .2s ease, transform .12s ease;
}
nav.tabs button:active { transform: scale(.94); }
nav.tabs button[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
nav.tabs button[aria-current="page"] svg { stroke-width: 2.2; }

/* ---------- shared ---------- */
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--vcol); flex: none; display: inline-block; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 4px 10px; }
.sec-h h3 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
.sec-h small { color: var(--muted); font-size: 12.5px; }
.lead { color: var(--muted); font-size: 14px; margin: 2px 4px 0; text-wrap: pretty; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap;
  transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; box-shadow: 0 6px 16px rgba(12, 14, 20, .18); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--accent); }
.btn.danger.armed { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 700; text-decoration: none; }

.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: background .15s ease, color .15s ease, transform .12s ease;
}
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.switch {
  flex: none; width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 3px;
  background: var(--surface-3); position: relative; transition: background .2s;
}
.switch::after {
  content: ""; display: block; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .22s cubic-bezier(.3,.7,.3,1.2);
}
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

.tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0; }
.tag.now { background: var(--accent-soft); color: var(--accent); }
.tag.late { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.lv4 { background: var(--accent); color: #fff; }
.tag.lv3 { background: var(--accent-soft); color: var(--accent); }
.tag.lv2 { background: var(--surface-2); color: var(--ink-2); }
.tag.lv1 { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

.note {
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px;
  font-size: 14px; color: var(--ink-2); display: grid; gap: 10px; margin-top: 12px; background: var(--surface); box-shadow: var(--shadow);
}
.note p { margin: 0; text-wrap: pretty; }
.note .row { display: flex; gap: 8px; flex-wrap: wrap; }
.note.warm { background: linear-gradient(135deg, var(--brand-soft), var(--surface)); border-color: transparent; color: var(--ink); }

/* ---------- 외부 상황 ---------- */
.envbar {
  display: flex; align-items: center; gap: 6px; margin: 4px 0 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px 8px 6px 6px; box-shadow: var(--shadow);
}
.envbar.warn { background: linear-gradient(135deg, var(--warn-soft), var(--surface) 80%); }
.envbar.good { background: linear-gradient(135deg, var(--ok-soft), var(--surface) 80%); }
.envbar.prompt { padding: 12px 12px 12px 16px; background: linear-gradient(135deg, var(--brand-soft), var(--surface)); }
.envmain { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: none; border: 0; padding: 6px 8px; text-align: left; font-size: 13px; color: var(--ink-2); border-radius: 16px; }
.envmain.static { padding: 0; gap: 4px 8px; }
.envmain b { color: var(--ink); font-weight: 800; }
.wx { display: flex; align-items: center; gap: 10px; flex-basis: 100%; }
.wx-ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.wx-ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wx-t { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
.wx-sub { display: grid; line-height: 1.25; min-width: 0; }
.wx-sub small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.wx-chips { display: flex; flex-wrap: wrap; gap: 5px; flex-basis: 100%; }
.wx-chips span { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.wx-chips span.bad { background: var(--warn-soft); color: var(--warn); }
.wx-chips span.good { background: var(--ok-soft); color: var(--ok); }
.envflag { flex-basis: 100%; font-size: 12.5px; font-weight: 700; color: var(--warn); }
.envbar.good .envflag { color: var(--ok); }
.envhol { font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); padding: 3px 10px; border-radius: 999px; }

/* ---------- 지금 내 상태 ---------- */
.state { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; margin: 0 0 12px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.state.compact { padding: 10px 14px 10px 16px; gap: 0; }
.st-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.st-head b { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
.st-head small { color: var(--muted); font-size: 12.5px; }
.st-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; }
.st-l { font-size: 12.5px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.seg { display: flex; flex-wrap: wrap; gap: 5px; }
.seg .chip { padding: 7px 12px; font-size: 13.5px; }
.chip.guess[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); border: 1px dashed var(--brand); }
.st-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.st-foot .linkbtn { font-size: 13px; }
.st-line { display: flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.st-line .when { font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
.st-line .linkbtn { margin-left: auto; font-size: 13px; }
.guesstag { font-size: 10.5px; font-weight: 800; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 1px 7px; margin-left: 2px; vertical-align: 1px; }
.st-gap { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 12px; margin-top: 8px; }

/* ---------- 지금 딱 하나 (히어로 카드) ---------- */
section.now {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: var(--r-xl); padding: 20px 20px 16px;
  display: grid; gap: 12px; color: #fff;
  background: linear-gradient(145deg, #5B57F2 0%, #8A5CF6 55%, #C04FD8 100%);
  box-shadow: var(--shadow-lg);
}
section.now::before {
  content: ""; position: absolute; z-index: -1; inset: auto -30% -55% auto; width: 90%; aspect-ratio: 1;
  border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.28), transparent);
  pointer-events: none;
}
section.now::after {
  content: ""; position: absolute; z-index: -1; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.2) 100%);
  pointer-events: none;
}
/* 시간대별 색 */
section.now.ph-wake, section.now.ph-am { background: linear-gradient(150deg, #F2994A 0%, #E0567A 50%, #7B4FE0 100%); }
section.now.ph-lunch, section.now.ph-pm { background: linear-gradient(150deg, #1F8FE5 0%, #2A6CF0 45%, #5B57F2 100%); }
section.now.ph-eve { background: linear-gradient(150deg, #F0705A 0%, #D9468C 45%, #6A45D8 100%); }
section.now.ph-night, section.now.ph-wind { background: linear-gradient(150deg, #3C3AB8 0%, #4B2E9E 50%, #1D1A4D 100%); }
section.now.ph-late { background: linear-gradient(150deg, #23254A 0%, #151733 60%, #0B0C1C 100%); }
/* 날씨 */
section.now.wx-rain { background: linear-gradient(150deg, #4A6788 0%, #34506F 50%, #1F2F4A 100%); }
section.now.wx-rain::before {
  inset: 0; width: auto; aspect-ratio: auto; border-radius: 0;
  background: repeating-linear-gradient(105deg, rgba(255,255,255,.08) 0 1px, transparent 1px 14px);
  -webkit-mask: linear-gradient(180deg, #000, transparent 85%); mask: linear-gradient(180deg, #000, transparent 85%);
}
section.now.wx-dust { background: linear-gradient(150deg, #8A7A62 0%, #6E6255 50%, #4A4540 100%); }
section.now.wx-heat { background: linear-gradient(150deg, #F59E0B 0%, #EA580C 50%, #B42318 100%); }
section.now.is-ev { background: linear-gradient(150deg, #0F172A 0%, #1E293B 55%, #334155 100%); }
section.now.is-ev.lv-4 { background: linear-gradient(150deg, #E5484D 0%, #B4233B 55%, #6E1B3B 100%); }

section.now.flash { animation: flash .9s ease; }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow-lg); } 30% { box-shadow: 0 0 0 4px var(--brand), var(--shadow-lg); } }
section.now.enter { animation: enter .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { transform: translateY(18px) scale(.98); opacity: 0; } }
.now-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.78); font-weight: 800; }
.rank {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink-2);
  padding: 5px 12px; border-radius: 999px; background: var(--surface-2);
}
section.now .rank { background: rgba(255,255,255,.18); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
section.now .rank .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.now-title { font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.035em; margin: 2px 0 0; text-shadow: 0 1px 12px rgba(0,0,0,.12); }
section.now.calm .now-title { font-size: 25px; }
.now-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
section.now .tag { background: rgba(255,255,255,.18); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
section.now .tag.ok, section.now .tag.late, section.now .tag.now, section.now .tag.lv3 { background: rgba(255,255,255,.94); color: #1A1C24; box-shadow: none; }
section.now .tag.lv4 { background: #fff; color: #D0343A; }
.now-why { font-size: 14.5px; color: rgba(255,255,255,.9); margin: 0; text-wrap: pretty; line-height: 1.55; }
.now-btns { display: flex; gap: 8px; margin-top: 4px; }
.now-btns .btn { flex: 1 1 0; min-width: 0; padding: 0 10px; font-size: 14.5px; min-height: 50px; white-space: normal; line-height: 1.2; text-align: center; background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.28); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.now-btns .btn.primary { flex: 1.7 1 0; background: #fff; color: #11131A; border-color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.now-mini { margin: 0; font-size: 13px; color: rgba(255,255,255,.8); text-wrap: pretty; }
.now-mini b { color: #fff; }
.justdone { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(255,255,255,.18); border-radius: 999px; padding: 7px 12px 7px 8px; justify-self: start; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.justdone svg { width: 20px; height: 20px; flex: none; fill: none; stroke: #11131A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; background: #fff; border-radius: 50%; padding: 3px; box-sizing: border-box; }
.justdone span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.nextline { display: flex; align-items: baseline; gap: 10px; border-top: 1px solid rgba(255,255,255,.2); padding-top: 12px; margin-top: 2px; font-size: 13.5px; color: rgba(255,255,255,.82); }
.nextline b { color: #fff; font-weight: 700; }
.nextline .k { flex: none; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; color: rgba(255,255,255,.62); }
.focus-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; margin-top: -4px; }
.focus-foot .linkbtn { font-size: 13px; color: rgba(255,255,255,.75); font-weight: 600; }
details.why { background: rgba(0,0,0,.14); border-radius: var(--r-md); padding: 2px 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
details.why > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.92); padding: 10px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.why > summary::-webkit-details-marker { display: none; }
details.why > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .2s; margin-right: 2px; }
details.why[open] > summary::before { transform: rotate(45deg); }
.fx { display: grid; gap: 7px; margin: 0 0 12px; }
.fx-r { display: grid; grid-template-columns: 14px 54px minmax(0, 1fr); gap: 6px; font-size: 13px; align-items: baseline; }
.fx-s { font-style: normal; font-size: 10px; color: rgba(255,255,255,.55); text-align: center; }
.fx-s.up { color: #A6F4C5; }
.fx-s.dn { color: #FEDF89; }
.fx-k { color: rgba(255,255,255,.65); font-weight: 700; }
.fx-v { color: #fff; overflow-wrap: anywhere; }

/* ---------- 오늘 요약 ---------- */
.daybar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.daybar > span, .daybar > .linkbtn { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; box-shadow: var(--shadow); }
.daybar b { color: var(--ink); font-weight: 800; }
.daybar > .linkbtn { color: var(--brand); }
details.all { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 16px 16px; box-shadow: var(--shadow); }
details.all:not([open]) { padding-bottom: 0; }
details.all > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 0; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
details.all > summary::-webkit-details-marker { display: none; }
details.all > summary small { color: var(--muted); font-weight: 600; font-size: 12.5px; margin-left: 8px; letter-spacing: 0; }
details.all > summary svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
details.all[open] > summary svg { transform: rotate(180deg); }

.summary { display: flex; align-items: center; gap: 16px; padding-block: 6px 14px; }
.ring { position: relative; width: 68px; height: 68px; flex: none; }
.ring svg { width: 68px; height: 68px; transform: rotate(-90deg); }
.ring circle + circle { stroke: var(--brand) !important; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; }
.sum-text { flex: 1; min-width: 0; display: grid; gap: 6px; }
.sum-label { font-size: 13px; color: var(--muted); font-weight: 700; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 7px; border-radius: 4px; background: var(--grid); }
.segs i.on { background: var(--vcol); }
.segs i.half { background: linear-gradient(90deg, var(--vcol) 50%, var(--grid) 50%); }
.sum-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--ink-2); }
.sum-meta b { font-weight: 800; color: var(--ink); }

/* ladder */
.rung { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding-block: 12px 6px; border-top: 1px solid var(--line); }
.rung-num { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; padding-top: 2px; color: var(--vcol); }
.rung-num::after { content: ""; display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--vcol); margin: 7px 0 0 2px; opacity: .5; }
.rung-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; }
.rung-head .cnt { color: var(--muted); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.items { list-style: none; margin: 2px 0 0; padding: 0; }
.item { display: flex; align-items: center; gap: 4px; min-height: 50px; }
.check { flex: none; width: 44px; height: 44px; margin-left: -10px; background: none; border: 0; padding: 0; display: grid; place-items: center; }
.check .c { width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s cubic-bezier(.3,1.6,.5,1); }
.check svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.item.done .check .c { background: var(--ok); border-color: var(--ok); transform: scale(1.05); }
.item.done .check svg { opacity: 1; }
.item.skip .check .c { border-style: dashed; }
.item-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; display: grid; gap: 2px; }
.item-main .t { font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
.item.done .t { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; font-weight: 500; }
.item.skip .t { color: var(--faint); }
.item.later .t { color: var(--ink-2); font-weight: 500; }
.item.is-now .t { font-weight: 800; }
.item.done.mini .check .c { background: var(--ok-soft); border-color: var(--ok); }
.item.done.mini .check svg { stroke: var(--ok); }
.item.done.mini .t { text-decoration: none; color: var(--ink-2); }
.empty-rung { font-size: 13.5px; color: var(--muted); padding: 6px 0 8px; }

/* ---------- plan ---------- */
.vrow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 14px 16px 10px; margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.vrow .rung-num { padding-top: 8px; }
.vhead { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.vhead b { font-size: 16.5px; font-weight: 800; letter-spacing: -0.02em; }
.vwhy { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.vtools { display: flex; gap: 4px; }
.vtools .iconbtn { width: 36px; height: 36px; box-shadow: none; }
.vtools .iconbtn svg { width: 18px; height: 18px; }
.vtools .iconbtn[disabled] { opacity: .35; cursor: default; }
.alist { grid-column: 1 / 4; list-style: none; margin: 4px 0 0; padding: 0; }
.alist li button { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 0; text-align: left; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.alist .t { font-size: 15px; font-weight: 600; }
.alist .meta { justify-content: flex-end; text-align: right; white-space: nowrap; }
.bell { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -2px; }
.addrow { grid-column: 1 / 4; border-top: 1px solid var(--line); padding-top: 6px; }
.weights { font-size: 12.5px; color: var(--muted); margin: 4px 4px 4px; font-variant-numeric: tabular-nums; }

/* ---------- decide ---------- */
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.opt-h { display: flex; justify-content: space-between; align-items: center; }
.opt-h b { font-size: 12.5px; letter-spacing: .1em; color: var(--brand); font-weight: 800; }
.vs { text-align: center; font-weight: 800; color: var(--faint); font-size: 12px; letter-spacing: .2em; margin: 10px 0; }
.scroller { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.verdict { margin-top: 16px; border-radius: var(--r-xl); padding: 20px; background: linear-gradient(145deg, #5B57F2, #8A5CF6 60%, #C04FD8); color: #fff; display: grid; gap: 10px; box-shadow: var(--shadow-lg); }
.verdict .k { font-size: 12px; letter-spacing: .12em; opacity: .8; font-weight: 800; }
.verdict h2 { margin: 0; font-size: 23px; line-height: 1.3; letter-spacing: -0.03em; font-weight: 800; }
.verdict p { margin: 0; font-size: 14px; opacity: .92; text-wrap: pretty; }
.verdict .btn { background: #fff; color: #11131A; border-color: #fff; justify-self: start; }
.calc { margin-top: 10px; display: grid; gap: 6px; font-size: 13.5px; }
.calc .ln { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; }
.calc .ln b { font-variant-numeric: tabular-nums; }
.calc .ln .who { font-weight: 800; color: var(--muted); }
.presets { margin: 4px 0 14px; }

/* ---------- stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 2px; align-content: start; box-shadow: var(--shadow); }
.tile .l { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.35; }
.tile .v { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
.tile .v small { font-size: 14px; font-weight: 700; margin-left: 1px; }
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 12px 10px; position: relative; box-shadow: var(--shadow); }
.chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
.chartbox text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chartbox .axis { stroke: var(--grid); stroke-width: 1; }
.chartbox .bar { fill: var(--chart); }
.chartbox .bar.today { fill: var(--brand); }
.chartbox .hit { fill: transparent; cursor: pointer; }
.chartbox .met { fill: var(--vcol); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: var(--shadow); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 10px 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i[style*="--accent"] { background: var(--brand) !important; }
details.tbl { margin-top: 8px; font-size: 13px; }
details.tbl summary { color: var(--muted); cursor: pointer; padding: 4px 4px; }
details.tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
details.tbl th, details.tbl td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); font-weight: 500; }
details.tbl th { color: var(--muted); font-size: 12px; }
.vbars { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.vbar { display: grid; grid-template-columns: 20px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 13.5px; }
.vbar .r { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.vbar .name { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-weight: 600; }
.vbar .track { height: 10px; border-radius: 999px; background: var(--grid); position: relative; overflow: hidden; }
.vbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--vcol); min-width: 2px; }
.vbar .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; box-sizing: border-box;
  background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  animation: up .32s cubic-bezier(.2, .9, .25, 1);
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 2px auto 12px; }
.sheet h2 { font-size: 22px; margin: 6px 0 6px; letter-spacing: -0.03em; font-weight: 800; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0; text-wrap: pretty; }
.field { display: grid; gap: 8px; margin-top: 18px; }
.field > .lbl { font-size: 13px; color: var(--muted); font-weight: 700; }
.field .hint { font-size: 12.5px; color: var(--faint); }
input[type="text"], input[type="time"], input[type="date"], input[type="number"], textarea, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
  border: 1px solid transparent; border-radius: var(--r-md); padding: 13px 14px; width: 100%; box-sizing: border-box;
  transition: border-color .15s, background .15s;
}
input:focus, textarea:focus, select:focus { background: var(--surface); border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--brand-soft); }
input[type="time"] { max-width: 180px; }
input[type="date"] { max-width: 220px; }
.evtimes input[type="time"] { max-width: 138px; }
textarea { min-height: 110px; resize: vertical; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
.sheet-btns { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.sheet-btns .primary { flex: 1 1 140px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; }
.setrow .tx b { display: block; font-size: 15px; font-weight: 700; }
.setrow .tx span { display: block; font-size: 13px; color: var(--muted); text-wrap: pretty; }
.setgroup { margin-top: 18px; background: var(--surface-2); border-radius: var(--r-lg); padding: 4px 16px; }
.setgroup > h3 { font-size: 12px; letter-spacing: .08em; color: var(--brand); margin: 12px 0 0; font-weight: 800; }
.itemsheet-btns { display: grid; gap: 8px; margin-top: 18px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.days .chip { justify-content: center; padding: 9px 0; }
.judge { font-size: 13px; color: var(--brand); font-weight: 600; background: var(--brand-soft); border-radius: var(--r-sm); padding: 10px 12px; margin: 10px 0 0; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box;
  background: rgba(17, 19, 26, .92); color: #fff; border-radius: 999px; padding: 11px 18px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
  animation: toastup .28s cubic-bezier(.2, .9, .25, 1);
}
.toast button { background: none; border: 0; color: #B6B4FF; font-weight: 800; padding: 4px 0; white-space: nowrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes toastup { from { transform: translate(-50%, 16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- measure ---------- */
.mhero { background: linear-gradient(150deg, #17915A 0%, #0F766E 55%, #134E4A 100%); color: #fff; padding: 24px; border-radius: var(--r-xl); margin: 4px 0 18px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
.mhero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.22), transparent); }
.mhero h2 { font-size: 26px; letter-spacing: -0.04em; margin: 6px 0 9px; line-height: 1.3; font-weight: 800; }
.mhero p { font-size: 13px; opacity: .88; margin: 0 0 16px; }
.mhero .btn { background: rgba(255,255,255,.95); color: #11131A; border: 0; }
.meyebrow { font-size: 11px; letter-spacing: .14em; font-weight: 800; opacity: .8; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcard { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; box-shadow: var(--shadow); }
.mcard h3 { font-size: 14px; margin: 8px 0 6px; font-weight: 800; letter-spacing: -0.01em; }
.mnum { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.3; }
.mnum small { font-size: 12px; font-weight: 600; letter-spacing: 0; }
.mnum .nil { color: var(--faint); font-weight: 500; }
.mtag { display: inline-block; background: var(--ok-soft); color: var(--ok); font-size: 10.5px; padding: 3px 8px; border-radius: 999px; font-weight: 800; }
.mtag.personal { background: var(--surface-2); color: var(--muted); }
.mnote { font-size: 12px; color: var(--muted); line-height: 1.65; margin: 8px 0 0; }
.mbar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 12px 0 0; }
.mbar span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.mrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mrow .btn { flex: 1; }
.mform { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mform .field { margin: 0; }
.mform input, .mform select { width: 100%; box-sizing: border-box; min-height: 48px; }
.mwide { grid-column: 1 / -1; }
.mnext { margin: 14px 0; background: var(--ok-soft); padding: 18px; border-radius: var(--r-lg); }
.mnext h3 { font-size: 15px; margin: 0 0 8px; font-weight: 800; }
.mnext p { margin: 0 0 12px; font-size: 13px; line-height: 1.65; }
.mtable { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.mtable td, .mtable th { padding: 11px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.mtable td:first-child, .mtable th:first-child { text-align: left; }
.mtable th { color: var(--muted); font-weight: 600; }
.mtable.hrs tr.bad td { color: var(--warn); font-weight: 700; }
.msource { padding: 16px 0; border-bottom: 1px solid var(--line); }
.msource h3 { margin: 0 0 5px; font-size: 15px; font-weight: 800; }
.msource p { font-size: 13px; line-height: 1.7; }
.msource a { color: var(--brand); font-size: 13px; font-weight: 600; }
.mcompact { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--ok-soft); padding: 14px 16px; border-radius: var(--r-md); margin: 0 0 12px; }
.mcompact p { font-size: 12px; margin: 4px 0 0; color: var(--muted); }
.merror { color: var(--accent); font-size: 13px; min-height: 20px; }
.mhistory { overflow: auto; }
.mfoot { margin: 18px 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.efflist { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 5px; }
@media (max-width: 360px) { .mcard { padding: 12px; } .mnum { font-size: 23px; } .mhero h2 { font-size: 24px; } .now-title { font-size: 26px; } .brand b { font-size: 24px; } }

/* ---------- 일정표 ---------- */
.dayscroll { margin-top: 2px; padding-block: 2px 4px; }
.daychip { flex-direction: column; gap: 0; padding: 8px 14px; line-height: 1.25; min-width: 58px; border-radius: 18px; }
.daychip small { font-size: 10.5px; font-weight: 700; }
.daychip.red:not([aria-pressed="true"]) { color: var(--accent); }
.dayweather { font-size: 13px; color: var(--ink-2); margin: 12px 4px 0; font-weight: 500; }
.dayweather.wet { color: var(--warn); font-weight: 700; }
.dayweather.hol { color: var(--accent); font-weight: 600; }
.timeline { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; position: relative; }
.tl { display: block; }
.tl-b { width: 100%; display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px 14px; text-align: left; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .12s; }
.tl-b:active { transform: scale(.985); }
.tl.ev .tl-b::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand); }
.tl.ev.lv4 .tl-b::before { background: var(--accent); }
.tl.ev.lv1 .tl-b::before { background: var(--faint); }
.tl.ev.live .tl-b { box-shadow: 0 0 0 2px var(--brand), var(--shadow); }
.tl.past .tl-b, .tl.done .tl-b, .tl.skipped .tl-b { opacity: .5; box-shadow: none; }
.tl.act .tl-b { background: transparent; border: 1.5px dashed var(--line); box-shadow: none; }
.tl.free, .tl.nowline { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; padding: 2px 15px; font-size: 12.5px; color: var(--faint); }
.tl.free .tl-t { font-size: 12px; font-weight: 600; }
.tl.nowline { color: var(--accent); font-weight: 800; align-items: center; padding-block: 2px; }
.tl.nowline .tl-m { display: flex; align-items: center; gap: 8px; }
.tl.nowline .tl-m::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--accent); }

    ['family', '가족·관계', ''],
    ['work', '일·커리어', ''],

    ['health', '일어나서 물 한 잔', 'morning', '07:00', false],
    ['health', '아침 스트레칭 5분', 'morning', '', false],

  ].map(([valueId, title, slot, time, remind]) => ({ id: uid(), valueId, title, slot, time, days: all.slice(), remind, created: today, mini: DEFAULT_MINI[title] || '' }));
  return {
    v: 1, metrics: normalizeMetrics(null), values, actions, log: {}, snooze: {}, offDays: {},
    settings: { guard: true, notify: false, brief: { on: true, time: '07:00' }, suggest: true, rhythm: { wake: '07:00', bed: '23:30' }, net: true, holidayRest: true },
    tips: { welcome: true, notify: true, focus: false, ext: true },

}
function migrate(s) {

  s.settings.brief = Object.assign({}, d.settings.brief, (s.settings && s.settings.brief) || {});
  s.settings.rhythm = Object.assign({}, d.settings.rhythm, (s.settings && s.settings.rhythm) || {});
  if (typeof s.settings.suggest !== 'boolean') s.settings.suggest = true;
  if (typeof s.settings.net !== 'boolean') s.settings.net = true;
  if (typeof s.settings.holidayRest !== 'boolean') s.settings.holidayRest = true;
  s.events = Array.isArray(s.events) ? s.events.filter(e => e && e.id && typeof e.title === 'string' && /^\d\d:\d\d$/.test(e.start || '')) : [];
  s.evLog = s.evLog && typeof s.evLog === 'object' ? s.evLog : {};
  s.region = s.region && typeof s.region.lat === 'number' && typeof s.region.lon === 'number' ? s.region : null;
  s.env = s.env && s.env.wx && s.env.wx.h ? s.env : null;

}
function loadLocal() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}

}
let state = loadLocal() || defaults();
let saveTimer = null;

function pruneLog() {

  Object.keys(state.offDays).forEach(k => { if (k < cutoff) delete state.offDays[k]; });
  if (state.evLog) Object.keys(state.evLog).forEach(k => { if (k < cutoff) delete state.evLog[k]; });
  if (state.events) { const old = dk(dayDate(-60)); state.events = state.events.filter(e => !e.date || e.date >= old); }

  Object.keys(state.snooze).forEach(k => { if (state.snooze[k] < t) delete state.snooze[k]; });

function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('기기 저장 공간이 부족해 저장하지 못했어요. 백업 코드를 복사해 주세요.'); } }

/* ---------- optional cloud sync (web version only) ---------- */
let remote = null;
async function initRemote() {
  if (APP || !window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;

    try { r = body && typeof body.json === 'string' ? JSON.parse(body.json) : null; } catch (e) { r = null; }

}

    await remote.ref.set({ json: JSON.stringify(state), updatedAt: state.updatedAt });
  } catch (e) {

/* ---------- Android bridge ---------- */
let lastSpec = null;
function reminderSpec() {
  const list = [];

  const b = state.settings.brief;

    const n = state.actions.filter(a => a.valueId === top.id && !a.date).length;
    list.push({ m: toMin(b.time), d: 127, t: `오늘도 ${top.name} 먼저`, b: `1순위 행동 ${n}개가 기다려요. 지금 할 일부터 확인하세요.` });
  }
  // 일정 알림: 출발 준비 시각(밖·일터 40분, 필수 60분, 집 10분 전). 한 번뿐인 일정은 7일 안에 있을 때만
  (state.events || []).filter(ev => ev.remind && ev.start).forEach(ev => {
    const j = evJudge(ev), lead = (ev.place === 'out' || ev.place === 'work') ? (j.lv >= 4 ? 60 : 40) : 10;

    .map(a => ({ a, r: state.values.findIndex(v => v.id === a.valueId) }))
    .filter(x => x.r >= 0 && x.a.remind && x.a.time && !x.a.date)
    .sort((x, y) => x.r - y.r);

    const mask = a.days.reduce((m, d) => m | (1 << d), 0);
    if (!mask) return;

/* ---------- day model ---------- */
const rankOf = valueId => state.values.findIndex(v => v.id === valueId);

}

    if (a.date ? a.date !== key : (!a.days.includes(wd) || (a.created && a.created > key))) return;

}

  // 같은 순위 안에서는: 지금 시각에 맞는 약속 → 시간대만 정한 일 → 시간이 한참 지난 일

const creditOf = x => x.st === 'done' ? (x.e && x.e.m ? 0.5 : 1) : 0;
const excused = x => x.st === 'skip' && x.e && x.e.x;
function stats(items) {
  let t = 0, d = 0, topT = 0, topD = 0, topC = 0;
  items.forEach(x => {
    if (excused(x)) return;
    const w = weight(x.rank), c = creditOf(x);
    t += w; d += w * c;
    if (x.rank === 0) { topT++; topC += c; if (x.st === 'done') topD++; }

  let n = 0;

    const d = dayDate(-i), key = dk(d);
    if (key < state.created) break;
    if (isOff(key)) continue;

}

  if (a.days.length === 5 && [1, 2, 3, 4, 5].every(d => a.days.includes(d))) return '평일';

/* ---------- 1.4 · 지금 딱 하나: 상태 + 시간대 + 일정 + 외부 데이터 추천 ---------- */
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
const PHASES = {
  late:  { name: '잘 시간',      slot: 'night' },
  wind:  { name: '잘 준비 시간', slot: 'night' },
  wake:  { name: '일어난 직후',  slot: 'morning' },

/* ---- 오늘 시간표 자동 배치: 일정 사이 빈 시간에 남은 행동을 순위·시간 창·날씨에 맞춰 넣기 ---- */
function arrangeToday(T) {
  const nd = T.nd, B = Math.max(dm(toMin(rhythm().bed)), nd + 5), start = Math.ceil(nd / 5) * 5;
  const occ = occFor(0).filter(o => !o.skip && !o.done && o.e > nd);
  let free = [[start, B]];
  const cut = (a, b) => {
    const nf = [];
    free.forEach(([x, y]) => { if (b <= x || a >= y) nf.push([x, y]); else { if (a > x) nf.push([x, a]); if (b < y) nf.push([b, y]); } });
    free = nf.filter(([x, y]) => y - x >= 1);
  };
  occ.forEach(o => cut(o.s - evLead(o), o.e));
  const hol = holidayOf(T.key);
  const items = T.items.filter(x => !x.st).map(x => {
    const a = x.a, [ws, we] = windowOf(a);
    return { x, a, ws, we, est: estMin(a.title), out: isOutdoor(a.title), bound: TIME_BOUND.test(a.title), back: hol && state.settings.holidayRest !== false && isWorkValue(x.v) };
  }).filter(it => !(it.we < nd && it.bound))
    .sort((p, q) => (p.back - q.back) || p.x.rank - q.x.rank || p.ws - q.ws);
  const fitIn = (lo, hi, dur, out, pref) => {
    for (const [x, y] of free) {
      let s = Math.max(x, lo); if (pref != null && pref >= s && pref + dur <= Math.min(y, hi)) s = pref;
      for (; s + dur <= Math.min(y, hi); s += 15) {
        if (!out || (outOkAt(T, s) && outOkAt(T, s + dur - 1))) return s;
      }
    }
    return null;
  };
  const placed = [], unplaced = [];
  items.forEach(it => {
    const pref = it.a.time ? dm(toMin(it.a.time)) : null;
    let s = fitIn(Math.max(it.ws, start), it.we, it.est, it.out, pref), note = '';
    let dur = it.est, indoor = false;
    if (s == null && it.out) { s = fitIn(Math.max(it.ws, start), it.we, it.est, false, pref); if (s != null) { indoor = true; note = '날씨 때문에 실내로'; } }
    if (s == null && !it.bound) { s = fitIn(start, B, it.est, false, null); if (s != null) note = '시간 창 밖이지만 빈 시간에'; }
    if (s == null && it.a.mini) { dur = estMin(it.a.mini); s = fitIn(Math.max(it.ws, start), it.bound ? it.we : B, dur, false, null); if (s != null) note = '자리가 좁아 작은 버전'; }
    if (s == null) { unplaced.push(it); return; }
    if (it.back) note = note ? `${note} · 휴일이라 뒤로` : '휴일이라 뒤로';
    cut(s, s + dur);
    placed.push({ it, s, e: s + dur, note, indoor });
  });
  placed.sort((a, b) => a.s - b.s);
  return { occ, placed, unplaced, free, B };
}

function wxIcon(c, night) {

function heroTone(R, c) {

function clashWhy(w, l) {
  if (w.j.lv !== l.j.lv) return `${LV_NAME[w.j.lv]} > ${LV_NAME[l.j.lv]}`;
  const wn = w.j.rank >= 0 ? `${w.j.rank + 1}순위 ${state.values[w.j.rank].name}` : '분류 없음';
  const ln = l.j.rank >= 0 ? `${l.j.rank + 1}순위` : '분류 없음';
  return `둘 다 ${LV_NAME[w.j.lv]} · ${wn}가 ${ln}보다 앞섬`;
}
function dayWeather(d) {
  const e = state.env;
  if (!state.settings.net || !state.region || !e || !e.wx || Date.now() - e.at > NET_STALE) return '';
  const i = e.wx.d.time.indexOf(dk(d)); if (i < 0) return '';
  const pp = e.wx.d.pp[i], tx = e.wx.d.tx[i], tn = e.wx.d.tn[i], uv = e.wx.d.uv[i];
  const bits = [pp != null ? `비 최고 ${pp}%` : '', tn != null && tx != null ? `${Math.round(tn)}–${Math.round(tx)}℃` : '', uv != null ? `자외선 ${Math.round(uv)}` : '',
    e.wx.d.sr[i] ? `해 ${hm(minOfIso(e.wx.d.sr[i]))}–${hm(minOfIso(e.wx.d.ss[i]))}` : ''].filter(Boolean);
  return `<p class="dayweather ${pp >= 60 ? 'wet' : ''}">${esc(state.region.name)} · ${esc(bits.join(' · '))}</p>`;
}

      </div>`;
    },
    mount(sh) {
      sh.querySelectorAll('[data-ev]').forEach(el => el.addEventListener('input', () => {

        if (el.dataset.ev === 'title') { const p = $('#e-judge', sh); if (p) p.textContent = judgeText(); }
      }));
      if (!existing) { const t = $('#e-title', sh); if (t && !d.title) setTimeout(() => t.focus(), 60); }
    },
    handlers: {
      eRep: ds => { if (ds.v === 'weekly') { d.days = d.days && d.days.length ? d.days : [dayDate(ui.schedDay || 0).getDay()]; delete d.date; } else { d.date = d.date || dk(baseDay); d.days = null; } drawSheet(); },
      eDay: ds => { const w = Number(ds.v); d.days = (d.days || []).includes(w) ? d.days.filter(x => x !== w) : (d.days || []).concat(w); drawSheet(); },
      ePlace: ds => { d.place = ds.v; drawSheet(); },
      eCat: ds => { d.cat = ds.v; drawSheet(); },
      eImp: ds => { d.imp = ds.v; drawSheet(); },
      eRemind: () => { d.remind = !d.remind; drawSheet(); },
      eSkipOnce: () => {
        state.evLog = state.evLog || {}; state.evLog[occKey] = state.evLog[occKey] || {};
        const L = state.evLog[occKey][d.id] = state.evLog[occKey][d.id] || {};
        if (L.s === 'skip') delete L.s; else L.s = 'skip';
        save(); closeSheet(); render(); toast(L.s === 'skip' ? '이번 일정만 건너뛰었어요' : '건너뛰기를 취소했어요');
      },
      eUndone: () => { const L = ((state.evLog || {})[occKey] || {})[d.id]; if (L) delete L.s; save(); closeSheet(); render(); },
      eDel: () => {
        if (!armed) { armed = true; drawSheet(); return; }
        state.events = state.events.filter(e => e.id !== d.id);
        Object.values(state.evLog || {}).forEach(l => { delete l[d.id]; });
        save(); closeSheet(); render(); toast('일정을 삭제했어요');
      },
      eSave: () => {
        const err = t => { const p = $('#e-err'); if (p) p.textContent = t; };
        d.title = (d.title || '').trim();
        if (!d.title) { const t = $('#e-title'); if (t) t.focus(); return err('일정 이름을 적어 주세요.'); }
        if (!d.start) return err('시작 시각을 정해 주세요.');
        if (d.date === undefined || d.date === null) { if (!d.days || !d.days.length) return err('반복할 요일을 하나 이상 골라 주세요.'); delete d.date; }
        else if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) return err('날짜를 골라 주세요.');
        const clean = { id: d.id, title: d.title, start: d.start, end: d.end || '', place: d.place || 'home', cat: d.cat || 'auto', imp: d.imp || 'auto', remind: !!d.remind, created: d.created || T.key };
        if (d.date) clean.date = d.date; else clean.days = d.days.slice().sort();
        state.events = state.events || [];
        const i = state.events.findIndex(e => e.id === d.id);
        if (i >= 0) state.events[i] = clean; else state.events.push(clean);
        save(); closeSheet(); render();
        const j = evJudge(d);
        toast(`저장했어요 · ${LV_NAME[j.lv]}${j.vid ? ` · ${state.values[j.rank].name}` : ''}로 판단했어요`);
        if (d.remind && APP && !state.settings.notify) askNotify();
      },
    },
  });
}

        hours.push(`<tr class="${bad ? 'bad' : ''}"><td>${String(dt.getHours()).padStart(2, '0')}시</td><td>${esc(WMO(h.wc))}</td><td>${h.pp ?? '–'}%</td><td>${h.t != null ? Math.round(h.t) : '–'}℃</td><td>${g ? PM_NAME[g] : '–'}</td></tr>`);
      }
      const eff = [];
      if (e.outBad) eff.push(`밖에서 하는 행동은 실내 버전으로 바꿔요 (${e.bad.join(', ')}).`);
      else if (e.nice) eff.push('밖에서 하는 행동과 추천의 순서를 올려요 (걷기 좋은 날씨).');
      if (e.ppDay >= 50) eff.push(`나갈 일(밖 일정·출근 시간대)이 있으면 우산을 챙기게 해요 (오늘 남은 시간 최고 ${e.ppDay}%).`);
      if (e.pg >= 3) eff.push('나갈 일이 있으면 마스크를 챙기게 하고, 밖에서 하는 추천은 빼요.');
      if (e.uvMax >= 6) eff.push(`자외선이 높은 날이라 외출 전에 선크림을 권해요 (최고 ${Math.round(e.uvMax)}).`);
      if (e.warm) eff.push('체감 31℃ 이상이라 물과 그늘 휴식을 먼저 권해요.');
      if (e.ss != null && nowMin() < e.ss) eff.push(`해 지기 전 1시간 동안은 밖에서 하는 계획의 순서를 올려요 (일몰 ${hm(e.ss)}).`);
      if (e.dark) eff.push('해가 진 뒤라 밖에서 하는 추천은 빼고, 계획한 야외 행동엔 밝은 길로 가라고 알려요.');
      if (hol) eff.push(`오늘은 ${hol}: 집에 있는 날로 보고${state.settings.holidayRest !== false ? ' 일·커리어 행동은 뒤로 미루고' : ''} 가족 추천의 순서를 올려요.`);
      return head + `<div class="mgrid" style="margin-top:12px">
        ${card('지금 기온', e.t != null ? Math.round(e.t) : '–', '℃', `체감 ${e.at != null ? Math.round(e.at) : '–'}℃ · 오늘 ${e.tn != null ? Math.round(e.tn) : '–'}–${e.tx != null ? Math.round(e.tx) : '–'}℃`)}

        ${card('미세먼지', e.pg ? PM_NAME[e.pg] : '–', '', `초미세 ${e.pm25 != null ? Math.round(e.pm25) : '–'} · 미세 ${e.pm10 != null ? Math.round(e.pm10) : '–'} ㎍/㎥`)}
        ${card('자외선', e.uvMax != null ? Math.round(e.uvMax) : '–', '최고', `일출 ${e.sr != null ? hm(e.sr) : '–'} · 일몰 ${e.ss != null ? hm(e.ss) : '–'}`)}
      </div>

      <div class="sec-h"><h3>앞으로 12시간</h3><small>밖 활동 주의 시간은 색으로 표시</small></div>
      <table class="mtable hrs"><thead><tr><th>시각</th><th>날씨</th><th>비</th><th>기온</th><th>미세먼지</th></tr></thead><tbody>${hours.join('')}</tbody></table>

function itemRow(x, T, nowId) {
  const cls = ['item'];
  let tag = '';
  if (x.st === 'done') {
    cls.push('done');
    if (x.e && x.e.m) { cls.push('mini'); tag = '<span class="tag ok">작게 완료</span>'; }
    if (x.e && x.e.o) tag += '<span class="tag late">순서 건너뜀</span>';
  }
  else if (x.st === 'skip') { cls.push('skip'); tag = x.e && x.e.mv ? '<span class="tag">내일로</span>' : x.e && x.e.x ? '<span class="tag">사정</span>' : '<span class="tag">건너뜀</span>'; }
  else if (x.a.id === nowId) { cls.push('is-now'); tag = '<span class="tag now">지금</span>'; }
  else if (snoozed(x.a.id)) { cls.push('later'); tag = '<span class="tag">잠시 뒤</span>'; }
  else if (x.due > T.nd) { cls.push('later'); }
  else if (x.a.time && T.nd > dm(toMin(x.a.time)) + 60) { tag = '<span class="tag late">시간 지남</span>'; }
  return `<li class="${cls.join(' ')}">
    <button class="check" data-act="toggle" data-id="${x.a.id}" aria-label="${esc(x.a.title)} ${x.st === 'done' ? '완료 취소' : '완료'}"><span class="c">${ICON_CHECK}</span></button>
    <button class="item-main" data-act="item" data-id="${x.a.id}"><span class="t">${esc(x.a.title)}</span>
      <span class="meta"><span>${esc(slotLabel(x.a))}</span>${tag}</span></button>
  </li>`;
}

/* decision helper */
function optScore(o) {
  const W = state.values.length;
  const r = rankOf(o.value);
  const base = r < 0 ? 0 : weight(r);
  let imp = 0;
  if (o.impact === 'harm') imp = -W;
  else if (o.impact === 'help' && r !== 0) imp = Math.ceil(W / 2);
  return { r, base, imp, total: base + imp };
}

function lastDays(n) {

    const d = dayDate(-i), key = dk(d);

    const s = has ? stats(itemsFor(key, d.getDay())) : null;
    out.push({ d, key, has, s, off: isOff(key), today: i === 0 });
  }
  return out;
}
function viewStats() {

  days.forEach(x => { const l = state.log[x.key] || {}; Object.values(l).forEach(e => { if (e.s === 'done') { doneN++; if (e.o) oooN++; } }); });
  const orderRate = doneN ? Math.round((doneN - oooN) / doneN * 100) : null;

    let t = 0, d = 0;

    return { v, r, t, d, pct: t ? Math.round(d / t * 100) : null };
  });
  const topRate = rates[0].pct;

  let insight;
  if (topRate == null) insight = `1순위 ${top.name}에 정해 둔 행동이 없어요. 계획에서 추가해 보세요.`;
  else if (over) insight = `${over.v.name}(${over.r + 1}순위) 실천율이 ${top.name}(1순위)보다 높아요. 순위와 행동이 어긋나고 있으니 ${top.name}부터 챙겨 보세요.`;
  else if (topRate >= 80) insight = `1순위 ${josa(top.name, '을', '를')} 잘 지키고 있어요. 순위대로 살고 있다는 뜻이에요.`;
  else insight = `1순위 ${top.name} 실천율이 ${topRate}%예요. 내일은 ‘지금 할 일’ 카드부터 끝내 보세요.`;
  const tracked = days.filter(x => x.has).length;
  let excN = 0, miniN = 0;
  days.forEach(x => { const l = state.log[x.key] || {}; Object.values(l).forEach(e => { if (e.s === 'skip' && e.x) excN++; if (e.s === 'done' && e.m) miniN++; }); });
  const offN = days.filter(x => x.has && x.off).length;
  const allow = [miniN ? `작게라도 한 행동 ${miniN}개 절반 반영` : '', excN ? `사정으로 뺀 행동 ${excN}개 제외` : '', offN ? `사정 있는 날 ${offN}일 제외` : ''].filter(Boolean);

  return `<div class="sec-h" style="margin-top:8px"><h3>최근 7일</h3><small>${tracked < 7 ? `기록 ${tracked}일째` : '매일 새벽 4시 기준'}</small></div>

    <div class="tile"><span class="l">순서 지킴률</span><span class="v">${orderRate == null ? '–' : orderRate}<small>${orderRate == null ? '' : '%'}</small></span></div>

function mountChart() {
  const svg = $('#chart'); if (!svg) return;
  const days = lastDays(7);
  const top = state.values[0];
  const W = 320, H = 170, L = 26, R = 6, T = 10, B = 40;
  const pw = W - L - R, ph = H - T - B;
  const band = pw / 7, bw = Math.min(24, band * 0.5);
  const y = v => T + ph - ph * v / 100;
  let g = '';
  [0, 50, 100].forEach(v => { g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  days.forEach((x, i) => {
    const cx = L + band * i + band / 2;
    const val = x.has && !x.off && x.s.score != null ? x.s.score : null;
    if (val != null && val > 0) {
      const h = ph * val / 100, top_ = y(val), r = Math.min(4, h);
      g += `<path class="bar ${x.today ? 'today' : ''}" d="M${cx - bw / 2},${y(0)} V${top_ + r} Q${cx - bw / 2},${top_} ${cx - bw / 2 + r},${top_} H${cx + bw / 2 - r} Q${cx + bw / 2},${top_} ${cx + bw / 2},${top_ + r} V${y(0)} Z"/>`;
    } else if (val === 0) {
      g += `<line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--chart)" stroke-width="2"/>`;
    }
    if (x.off) g += `<text x="${cx}" y="${y(0) - 6}" text-anchor="middle">사정</text>`;
    g += `<text x="${cx}" y="${H - 22}" text-anchor="middle" style="${x.today ? 'fill:var(--ink);font-weight:700' : ''}">${WD[x.d.getDay()]}</text>`;
    if (x.has && !x.off && topMet(x.s)) g += `<circle class="met vc" style="${vcStyle(top)}" cx="${cx}" cy="${H - 8}" r="4"/>`;
    const label = `${x.d.getMonth() + 1}/${x.d.getDate()} ${WD[x.d.getDay()]} · ${x.off ? '사정 있는 날' : val == null ? '기록 없음' : `점수 ${val}`}${x.has && x.s.topT ? ` · 1순위 ${x.s.topD}/${x.s.topT}` : ''}`;

  });

  const show = el => {

  svg.querySelectorAll('.hit').forEach(el => {

      fDay: ds => { const w = Number(ds.v); d.days = d.days.includes(w) ? d.days.filter(x => x !== w) : d.days.concat(w); drawSheet(); },
      fRemind: () => { d.remind = !d.remind; drawSheet(); },
      fDelete: () => {
        if (!armed) { armed = true; drawSheet(); return; }
        state.actions = state.actions.filter(x => x.id !== d.id);
        Object.values(state.log).forEach(l => { delete l[d.id]; });
        save(); closeSheet(); render(); toast('행동을 삭제했어요');
      },
      fSave: () => {
        d.title = d.title.trim();
        d.mini = (d.mini || '').trim();
        if (!d.title) { const t = $('#f-title'); if (t) { t.focus(); t.placeholder = '할 일을 적어 주세요'; } return; }
        if (!d.date && !d.days.length) { toast('반복 요일을 하나 이상 골라 주세요'); return; }
        if (d.time) d.slot = slotFromTime(d.time);
        if (d.date === undefined) delete d.date;
        if (existing) Object.assign(existing, d); else state.actions.push(d);
        save(); closeSheet(); render();
        toast(existing ? '저장했어요' : (d.date ? '오늘 할 일에 넣었어요' : '행동을 추가했어요'));
        if (!existing && d.remind && APP && !state.settings.notify) askNotify();
      },
    },
  });
}

/* ---------- actions ---------- */
let toastTimer = null;
function toast(msg, action) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${action ? `<button data-act="${action.act}" data-id="${esc(action.id || '')}">${esc(action.label)}</button>` : ''}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, action ? 5000 : 2400);
}
function setLog(id, entry) {
  const key = today().key;
  state.log[key] = state.log[key] || {};
  if (entry) state.log[key][id] = entry; else delete state.log[key][id];
  delete state.snooze[id];
}
function blockersFor(id) {
  const T = today();
  const it = T.items.find(x => x.a.id === id);
  if (!it) return [];
  // 지금 시간대에 해야 하거나 아직 해도 되는, 더 높은 순위의 행동만 막음 (지난 아침 일 등은 제외)
  return recommend(T).list.filter(c => c.kind === 'act' && c.tier >= 7 && c.rank < it.rank && c.a.id !== id).map(c => c.x);
}
// 추천 카드에서 완료: 추천은 이미 순위·시간·상태를 따졌으므로 순서 확인 없이 기록
function finishCand(key, mode) {
  const T = today();
  const R = recommend(T);
  const c = R.list.find(x => x.key === key);
  if (!c) { render(); return; }
  const mini = mode === 'mini' || (mode == null && c.mini);
  let id, title;
  if (c.kind === 'ev' || c.kind === 'prep') {
    state.evLog = state.evLog || {}; state.evLog[c.o.key] = state.evLog[c.o.key] || {};
    const L = state.evLog[c.o.key][c.o.id] = state.evLog[c.o.key][c.o.id] || {};
    if (c.kind === 'ev') L.s = 'done'; else L.prep = 1;
    id = c.key; title = c.kind === 'ev' ? c.o.ev.title : c.title;
    ui.justDone = { title, at: Date.now(), mini: false };
    save(); closeSheet(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast(c.kind === 'ev' ? '일정 끝! 다음 걸 골랐어요' : '준비 끝! 잘 다녀오세요', { act: 'goUndo', id, label: '되돌리기' });
    return;
  }
  if (c.kind === 'act') {
    id = c.a.id;
    title = mini ? (c.a.mini || c.a.title) : c.a.title;
    setLog(id, { s: 'done', t: Date.now(), m: mini ? 1 : 0, o: 0 });
  } else {
    const sg = c.sg;
    id = uid();
    title = mini ? sg.mini : sg.t;
    state.actions.push({ id, valueId: c.v.id, title: sg.t, slot: PHASES[R.ph].slot, time: '', days: ALL_DAYS.slice(), remind: false, created: T.key, date: T.key, mini: sg.mini || '', sug: sg.id });
    setLog(id, { s: 'done', t: Date.now(), m: mini ? 1 : 0, o: 0 });
  }
  ui.justDone = { title, at: Date.now(), mini };
  save(); closeSheet(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const hasNext = !!recommend(today()).top;
  toast(mini ? '작게라도 했어요. 0보다 훨씬 나아요' : hasNext ? '완료! 다음 걸 골랐어요' : '완료! 지금은 여기까지', { act: 'goUndo', id, label: '되돌리기' });
}
function tryComplete(id) {
  const bl = blockersFor(id);
  if (bl.length && state.settings.guard && !isOff(today().key)) { guardSheet(id, bl[0]); return; }
  complete(id, bl.length > 0);
}
function complete(id, outOfOrder) {
  const a = state.actions.find(x => x.id === id); if (!a) return;
  setLog(id, { s: 'done', t: Date.now(), o: outOfOrder ? 1 : 0 });
  save(); closeSheet(); render();
  const R = recommend(today());
  toast(R.top ? `완료! 다음은 ‘${R.top.title}’` : '완료!', { act: 'undo', id, label: '되돌리기' });
}
function completeMini(id) {
  const a = state.actions.find(x => x.id === id); if (!a) return;

function normalizeMetrics(raw) {
  const m={profile:{age:'adult',focus:30,contact:10},days:{}};
  if(!raw || typeof raw!=='object')return m;
  if(raw.profile){
    if(['adult','older61','older65','custom'].includes(raw.profile.age))m.profile.age=raw.profile.age;
    for(const k of ['focus','contact'])if(Number.isInteger(raw.profile[k])&&raw.profile[k]>=1&&raw.profile[k]<=720)m.profile[k]=raw.profile[k];
  }
  const caps={sleep:24,moderate:1440,vigorous:1440,fruit:5000,focus:1440,contact:1440,strength:1};
  if(raw.days && typeof raw.days==='object')for(const [key,row] of Object.entries(raw.days)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||!row||typeof row!=='object')continue;
    const r={};for(const [k,cap] of Object.entries(caps))if(typeof row[k]==='number'&&Number.isFinite(row[k])&&row[k]>=0&&row[k]<=cap&&(k==='sleep'||Number.isInteger(row[k])))r[k]=row[k];
    if(typeof row.note==='string')r.note=row.note.slice(0,120);
    if(Object.keys(r).length)m.days[key]=r;
  }
  return m;
}

    <div class="field mwide"><label class="lbl" for="m-strength">근력운동 여부</label><select id="m-strength" data-metric="strength"><option value="" ${d.strength==null?'selected':''}>미입력</option><option value="0" ${d.strength===0?'selected':''}>하지 않음</option><option value="1" ${d.strength===1?'selected':''}>함 · 주요 근육군을 사용하는 운동</option></select><span class="hint">같은 날 여러 번 해도 1일로 셉니다. 스트레칭만 했다면 해당하지 않아요.</span></div>
    ${num('focus','집중한 시간 (분)',1440,'1','업무·공부에서 실제 집중한 합계')}${num('contact','대화한 시간 (분)',1440,'1','가족·친구와 나눈 대화 합계')}
    <div class="field mwide"><label class="lbl" for="m-note">다음 실천을 위한 메모</label><input id="m-note" maxlength="120" value="${esc(d.note||'')}" placeholder="예: 점심 뒤에 걸으니 실천하기 쉬웠다"></div></div>
    <p class="mnote">중강도와 고강도는 같은 시간을 중복 기록하지 마세요. 운동 강도 설명: CDC 대화 검사.</p><p id="m-error" class="merror" role="alert"></p><div class="sheet-btns"><button class="btn primary" data-act="mSave">수치 저장</button><button class="btn ghost" data-act="close">취소</button></div>`;
  },mount(sh){
    sh.querySelectorAll('[data-metric]').forEach(el=>el.addEventListener('input',()=>{d[el.dataset.metric]=el.value===''?undefined:Number(el.value);}));
    $('#m-note',sh).addEventListener('input',e=>d.note=e.target.value);
    $('#m-date',sh).addEventListener('change',e=>{if(e.target.value&&e.target.value<=dk(dayDate())){key=e.target.value;d={...(metrics().days[key]||{})};drawSheet();}});
  },handlers:{mSave(){
    const fail=t=>{$('#m-error').textContent=t;};
    if(!$('#m-date').value||$('#m-date').value!==key||key>dk(dayDate()))return fail('오늘 또는 이전 날짜를 선택해 주세요.');
    for(const el of document.querySelectorAll('[data-metric]'))if(!el.checkValidity())return fail('수치의 범위와 입력 단위를 확인해 주세요. 수면은 0.1시간, 나머지는 정수입니다.');
    if((d.moderate??0)+(d.vigorous??0)>1440)return fail('하루 운동 합계는 1,440분을 넘을 수 없어요.');
    const clean=normalizeMetrics({days:{[key]:d}}).days[key];
    if(clean)metrics().days[key]=clean;else delete metrics().days[key];
    save();closeSheet();render();toast('수치를 저장했어요');
  }}});
}
function mProfileSheet(){const d={...metrics().profile};openSheet({label:'내 기준 설정',html(){return `<h2>내 기준 설정</h2><p class="sub">공식 권고는 일반적인 참고 기준입니다. 개인 목표와 별도로 표시합니다.</p><div class="mform"><div class="field mwide"><label class="lbl" for="m-age">수면 연령 기준 / 비교 범위</label><select id="m-age"><option value="adult">18–60세</option><option value="older61">61–64세</option><option value="older65">65세 이상</option><option value="custom">일반 성인 기준 비교 끄기</option></select><span class="hint">미성년자, 임신·산후, 개별 치료·운동 제한 등에는 별도 기준이 필요할 수 있어요. 65세 이상은 균형을 포함한 복합 활동도 주 3일 이상 권고됩니다.</span></div>${[['focus','하루 집중 목표 (분)'],['contact','하루 대화 목표 (분)']].map(([k,l])=>`<div class="field"><label class="lbl" for="p-${k}">${l}</label><input type="number" id="p-${k}" min="1" max="720" step="1" value="${d[k]}"></div>`).join('')}</div><p class="mnote">집중 30분·대화 10분은 시작을 위한 예시값이며 과학적으로 정해진 최적 시간이 아닙니다. 자신에게 맞게 바꾸세요.</p><p class="merror" id="p-error" role="alert"></p><div class="sheet-btns"><button class="btn primary" data-act="pSave">기준 저장</button><button class="btn ghost" data-act="close">취소</button></div>`;},mount(sh){$('#m-age',sh).value=d.age;},handlers:{pSave(){for(const k of ['focus','contact']){const el=$('#p-'+k);if(!el.value||!el.checkValidity()){$('#p-error').textContent='개인 목표는 1–720분 사이 정수로 입력해 주세요.';return;}d[k]=Number(el.value);}d.age=$('#m-age').value;metrics().profile=d;save();closeSheet();render();toast('기준을 저장했어요');}}});}
function mEvidenceSheet(){openSheet({label:'수치의 근거와 계산',html(){return `<h2>수치의 근거와 계산</h2><p class="sub">2026-09-25 확인 · 공식 지침을 요약했습니다. 실제 기록은 자가 입력이며 자동 측정이나 진단이 아닙니다.</p>
  <section class="msource"><h3>01 · 유산소와 근력운동</h3><p>성인: 주 중강도 150–300분 또는 고강도 75–150분, 또는 그에 상당하는 조합. 주요 근육군을 사용하는 중강도 이상 근력운동은 주 2일 이상. 65세 이상은 균형과 근력을 강조하는 복합 활동을 주 3일 이상 추가합니다. 적은 양의 활동도 의미가 있습니다.</p><a href="https://www.who.int/europe/news-room/fact-sheets/item/physical-activity" target="_blank" rel="noopener">WHO · 신체활동 권고</a></section>
  <section class="msource"><h3>02 · 운동 환산과 강도 구분</h3><p>주간 합계 = 중강도 분 + 고강도 분 × 2. 건강 효과가 정확히 두 배라는 뜻이 아니라 활동량 비교용 환산입니다. 중강도는 대화할 수 있지만 노래하기 어려운 정도, 고강도는 숨을 고르지 않고 몇 마디 하기 어려운 정도입니다.</p><a href="https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html" target="_blank" rel="noopener">CDC · 운동 환산 기준</a><br><a href="https://www.cdc.gov/physical-activity-basics/measuring/index.html" target="_blank" rel="noopener">CDC · 운동 강도 측정</a></section>
  <section class="msource"><h3>03 · 수면</h3><p>18–60세는 하루 7시간 이상, 61–64세는 7–9시간, 65세 이상은 7–8시간. 수면의 질과 규칙성도 중요하며 오래 잘수록 점수가 높아지는 구조는 사용하지 않습니다. 실제 잔 시간을 기록하세요.</p><a href="https://www.cdc.gov/sleep/about/" target="_blank" rel="noopener">CDC · 연령별 수면 권고</a></section>
  <section class="msource"><h3>04 · 채소와 과일</h3><p>성인은 하루 총 400g 이상을 참고 기준으로 사용합니다. 감자·고구마 등 전분성 뿌리는 이 합계에서 제외합니다. 음식 크기별 고정 환산 대신 먹은 부분의 중량을 기록합니다.</p><a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet" target="_blank" rel="noopener">WHO · 건강한 식사</a><br><a href="https://www.who.int/docs/default-source/healthy-diet/healthy-diet-fact-sheet-394.pdf" target="_blank" rel="noopener">WHO · 제외 식품 설명</a></section>
  <section class="msource"><h3>05 · 개인 목표와 앱 규칙</h3><p>집중·대화 시간 목표, 추천 행동의 10분, 우선순위 가중치, 최소 행동 50%, 연속 달성 80%는 앱의 편의 규칙입니다. 임상적으로 검증된 점수나 최적 시간, 수명·질병 위험 예측값이 아닙니다.</p></section>
  <section class="msource"><h3>06 · 합계와 누락 처리</h3><p>주간 운동은 월요일부터 일요일, 최근 평균 수면은 오늘을 포함한 7일 중 입력한 날만 사용합니다. 앱 날짜는 새벽 4시에 바뀝니다. 빈칸은 미입력이고 0은 실제 0입니다. 주간 미입력이 있으면 표시된 합계가 실제보다 작을 수 있습니다.</p></section>
  <section class="msource"><h3>07 · ‘지금 딱 하나’ 추천 규칙</h3><p>시간대는 하루 리듬(기상·취침)과 시계로 나눕니다. 에너지·여유 시간·있는 곳은 직접 고른 값을 3시간 동안 쓰고, 고르지 않은 값은 시간대·요일·수면 기록으로 추정합니다. 추천 순서는 잘 시간 → 내 계획(지금 시간대의 일, 시간은 지났지만 아직 해도 되는 일) → 곧 할 계획 → 시간대 추천 행동이며, 같은 단계에서는 가치 순위가 먼저입니다. 아침·점심처럼 때가 정해진 일은 그 시간대가 지나면 권하지 않습니다. 행동의 걸리는 시간과 부담은 제목으로 어림하며, 상태에 안 맞으면 ‘작게라도’ 버전을 권합니다. 모두 앱의 편의 규칙이며 건강 효과를 보장하지 않습니다.</p></section>
  <section class="msource"><h3>08 · 날씨·공기·공휴일 반영</h3><p>날씨·비 예보·자외선·일출·일몰은 Open-Meteo 예보를, 미세먼지는 Open-Meteo의 CAMS 전 지구 예보(약 45km 격자)를 씁니다. 동네 측정소 값과 다를 수 있습니다. 미세먼지 등급은 에어코리아 예보 기준(초미세 15/35/75, 미세 30/80/150㎍/㎥)입니다. 밖에서 하는 행동은 비 확률 60% 이상·강수, 미세먼지 나쁨 이상, 체감 33℃ 이상(기상청 폭염주의보의 체감온도 기준값) 또는 −10℃ 이하, 바람 14m/s 이상일 때 실내 버전으로 바꾸며, 이 문턱값은 앱 규칙입니다. 날씨는 30분마다 새로 받고 3시간이 지나면 쓰지 않습니다. 공휴일은 2026–2027년 관공서 공휴일(2026년 지정된 노동절·제헌절 포함)을 앱에 넣어 두었고, 그 밖의 해는 Nager.Date에서 받습니다.</p><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a><br><a href="https://www.airkorea.or.kr/web/dustForecast" target="_blank" rel="noopener">에어코리아 · 대기질 예보</a><br><a href="https://www.kma.go.kr/kma/news/press_01.jsp?bid=press&mode=view&num=1194645" target="_blank" rel="noopener">기상청 · 폭염특보 기준 개편(2026)</a></section>
  <section class="msource"><h3>09 · 일정 자동 판단</h3><p>일정 제목의 단어로 분류(가치)와 중요도를 정합니다. 필수: 병원·진료·시험·면접·마감·비행기·기차·계약처럼 옮기기 어려운 일. 중요: 회의·수업·약속·생일처럼 다른 사람과 맞춘 시간, 또는 1순위 가치의 일정. 선택: 영화·쇼핑·카페처럼 미뤄도 되는 일. 그 밖엔 보통입니다. 직접 고르면 그 값을 씁니다. 겹치는 일정은 중요도가 높은 쪽, 같으면 가치 순위가 높은 쪽을 먼저로 봅니다. 보통 이상 일정 중에는 그 일정에 집중하도록 하고, 선택 일정 중에는 더 높은 순위의 계획을 먼저 권합니다. 밖·일터 일정은 40분 전(필수는 60분 전), 집 일정은 10분 전부터 준비를 권하고, 다음 일정까지 남은 시간을 여유 시간으로 씁니다.</p></section><div class="sheet-btns"><button class="btn block" data-act="close">닫기</button></div>`;}});}
function mAddPlan(){const n=mNext();if(!n.task)return;const T=today();if(state.actions.some(a=>a.title===n.task&&a.date===T.key)){toast('이미 오늘 계획에 있어요');return;}const v=state.values.find(v=>v.id===n.value)||state.values[0];state.actions.push({id:uid(),valueId:v.id,title:n.task,slot:'any',time:'',days:[0,1,2,3,4,5,6],remind:false,created:T.key,date:T.key,mini:''});save();toast('오늘 계획에 넣었어요');}
ACT.mRecord=ds=>mRecordSheet(ds.date);
ACT.mProfile=()=>mProfileSheet();
ACT.mEvidence=()=>mEvidenceSheet();
ACT.mNextPlan=()=>mAddPlan();

/* ---------- 1.3 · 지금 딱 하나: 동작 ---------- */
ACT.goDone = ds => finishCand(ds.key, ds.m === '1' ? 'mini' : ds.m === '0' ? 'full' : null);
ACT.goPass = ds => {
  state.snooze[ds.key] = Date.now() + 30 * 60000;
  ui.justDone = null;
  save(); render();
  toast('이건 30분 뒤에 다시 권할게요', { act: 'goUnpass', id: ds.key, label: '되돌리기' });
};
ACT.goUnpass = ds => { delete state.snooze[ds.id]; save(); render(); $('#toast-root').innerHTML = ''; };
ACT.goUndo = ds => {
  if (/^(ev|prep):/.test(ds.id)) {
    const [k, eid] = ds.id.split(':'), L = ((state.evLog || {})[today().key] || {})[eid];
    if (L) { if (k === 'ev') delete L.s; else delete L.prep; }
    ui.justDone = null; save(); render(); $('#toast-root').innerHTML = ''; return;
  }
  const a = state.actions.find(x => x.id === ds.id);
  if (a && a.sug) {
    state.actions = state.actions.filter(x => x.id !== ds.id);
    Object.values(state.log).forEach(l => { delete l[ds.id]; });
  } else setLog(ds.id, null);
  ui.justDone = null;
  save(); closeSheet(); render(); $('#toast-root').innerHTML = '';
};
ACT.unsnoozeAll = () => { state.snooze = {}; save(); render(); };
ACT.lateOk = () => { ui.lateOk = Date.now() + 30 * 60000; render(); };
ACT.st = ds => {
  const T = today();
  if (!checkinFresh(T)) state.checkin = { t: 0 };
  state.checkin[ds.f] = ds.f === 'time' ? Number(ds.v) : ds.v;
  state.checkin.t = Date.now();
  state.checkin.day = T.key;
  ui.justDone = null;
  const c = state.checkin; if (c.energy != null && c.time != null && c.place != null) ui.stOpen = false;
  save(); render();
};
ACT.stOk = () => {
  const T = today(), S = curState(T, phaseAt(T.nd));
  state.checkin = { t: Date.now(), day: T.key, energy: S.energy, time: S.time, place: S.place };
  ui.stOpen = false; save(); render();
};
ACT.stOpen = () => { ui.stOpen = true; render(); };
ACT.stClose = () => { ui.stOpen = false; render(); };
ACT.rhythm = () => rhythmSheet();
function rhythmSheet() {
  const r = rhythm();
  openSheet({
    label: '하루 리듬',
    html() {
      return `<h2>하루 리듬</h2>
      <p class="sub">‘지금 딱 하나’가 시간대를 나누는 기준이에요. 일어난 직후엔 아침 루틴을, 자려는 시각 1시간 전부터는 잘 준비를, 그 시각이 지나면 자는 것부터 권해요.</p>
      <div class="field"><label class="lbl" for="r-wake">보통 일어나는 시각</label><input type="time" id="r-wake" value="${esc(r.wake)}"><span class="hint">04:00–12:00</span></div>
      <div class="field"><label class="lbl" for="r-bed">자려는 시각</label><input type="time" id="r-bed" value="${esc(r.bed)}"><span class="hint">20:00–03:59</span></div>
      <p class="merror" id="r-err" role="alert"></p>
      <div class="sheet-btns"><button class="btn primary" data-act="rSave">저장</button><button class="btn ghost" data-act="close">취소</button></div>`;
    },
    handlers: {
      rSave: () => {
        const w = $('#r-wake').value, b = $('#r-bed').value;
        const err = t => { $('#r-err').textContent = t; };
        if (!w || toMin(w) < 240 || toMin(w) > 720) return err('일어나는 시각은 04:00–12:00 사이로 정해 주세요.');
        if (!b || (toMin(b) >= 240 && toMin(b) < 1200)) return err('자려는 시각은 20:00–03:59 사이로 정해 주세요.');
        state.settings.rhythm = { wake: w, bed: b };
        save(); closeSheet(); render();
        const gap = ((toMin(w) - toMin(b) + 1440) % 1440) / 60;
        toast(gap < 7 ? `저장했어요. 이대로면 누워 있는 시간이 ${Number(gap.toFixed(1))}시간이에요. 성인은 7시간 이상 수면이 권고돼요.` : '하루 리듬을 저장했어요');
      },
    },
  });
}
document.addEventListener('toggle', e => {
  if (!e.target) return;
  if (e.target.id === 'all-today') ui.allOpen = e.target.open;
  if (e.target.classList && e.target.classList.contains('why')) ui.whyOpen = e.target.open;
}, true);
/* ---------- 1.4 · 일정·외부 데이터 동작 ---------- */
ACT.schedDay = ds => { ui.schedDay = Number(ds.i) || 0; render(); };
ACT.evNew = () => evSheet({});
ACT.evEdit = ds => evSheet({ id: ds.id });
ACT.envSheet = () => envSheet();
ACT.envRefresh = () => { refreshEnv(true); refreshHolidays(); };
ACT.region = () => regionSheet();

/* ---------- boot ---------- */
persistLocal();
render();
syncReminders(true);
initRemote();
refreshEnv();
refreshHolidays();
})();
</script>
</body>
</html>
